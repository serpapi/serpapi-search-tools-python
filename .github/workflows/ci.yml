name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: uv sync --dev --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - name: Test the wheel in a base-only environment
        run: uv run tox -e clean-install
      - run: uv build

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            tox-environment: py310
          - python-version: "3.11"
            tox-environment: py311
          - python-version: "3.12"
            tox-environment: py312
          - python-version: "3.13"
            tox-environment: py313
          - python-version: "3.14"
            tox-environment: py314

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --dev --locked
      - run: uv run tox -e ${{ matrix.tox-environment }}

  framework-tests:
    name: ${{ matrix.provider }} on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: agno
            python-version: "3.10"
            tox-environment: integration-py310-agno
          - provider: agno
            python-version: "3.14"
            tox-environment: integration-py314-agno
          - provider: langchain
            python-version: "3.10"
            tox-environment: integration-py310-langchain
          - provider: langchain
            python-version: "3.14"
            tox-environment: integration-py314-langchain
          - provider: langgraph
            python-version: "3.13"
            tox-environment: integration-py313-langgraph
          - provider: crewai
            python-version: "3.10"
            tox-environment: integration-py310-crewai
          - provider: crewai
            python-version: "3.13"
            tox-environment: integration-py313-crewai
          - provider: google-adk
            python-version: "3.10"
            tox-environment: integration-py310-google-adk
          - provider: google-adk
            python-version: "3.14"
            tox-environment: integration-py314-google-adk
          - provider: claude-agent-sdk
            python-version: "3.10"
            tox-environment: integration-py310-claude-agent-sdk
          - provider: claude-agent-sdk
            python-version: "3.14"
            tox-environment: integration-py314-claude-agent-sdk
          - provider: llamaindex
            python-version: "3.10"
            tox-environment: integration-py310-llamaindex
          - provider: llamaindex
            python-version: "3.14"
            tox-environment: integration-py314-llamaindex
          - provider: openai-agents
            python-version: "3.10"
            tox-environment: integration-py310-openai-agents
          - provider: openai-agents
            python-version: "3.14"
            tox-environment: integration-py314-openai-agents
          - provider: pydantic-ai
            python-version: "3.10"
            tox-environment: integration-py310-pydantic-ai
          - provider: pydantic-ai
            python-version: "3.14"
            tox-environment: integration-py314-pydantic-ai
          - provider: autogen
            python-version: "3.10"
            tox-environment: integration-py310-autogen
          - provider: autogen
            python-version: "3.14"
            tox-environment: integration-py314-autogen
          - provider: microsoft-agent-framework
            python-version: "3.10"
            tox-environment: integration-py310-microsoft-agent-framework
          - provider: microsoft-agent-framework
            python-version: "3.14"
            tox-environment: integration-py314-microsoft-agent-framework
          - provider: haystack
            python-version: "3.10"
            tox-environment: integration-py310-haystack
          - provider: haystack
            python-version: "3.14"
            tox-environment: integration-py314-haystack
          - provider: semantic-kernel
            python-version: "3.10"
            tox-environment: integration-py310-semantic-kernel
          - provider: semantic-kernel
            python-version: "3.14"
            tox-environment: integration-py314-semantic-kernel
          - provider: smolagents
            python-version: "3.10"
            tox-environment: integration-py310-smolagents
          - provider: smolagents
            python-version: "3.14"
            tox-environment: integration-py314-smolagents

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --dev --locked
      - run: uv run tox -e ${{ matrix.tox-environment }}

  live-serpapi:
    name: Live SerpApi engine smoke tests
    needs: quality
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      SERPAPI_WEEKLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
      SERPAPI_LIVE_KEY_ARTIFACT: live-response-keys.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - run: uv sync --dev --locked
      - name: Require the live-test API key
        run: test -n "$SERPAPI_API_KEY" || test -n "$SERPAPI_KEY"
      - name: Run live search suite
        run: uv run tox -e live
      - name: Upload weekly response-key inventory
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serpapi-live-response-keys
          path: live-response-keys.json

  live-adapters:
    name: Live ${{ matrix.provider }} adapter on Python ${{ matrix.python-version }}
    needs: quality
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: agno
            python-version: "3.14"
            tox-environment: integration-py314-agno
          - provider: autogen
            python-version: "3.14"
            tox-environment: integration-py314-autogen
          - provider: microsoft-agent-framework
            python-version: "3.14"
            tox-environment: integration-py314-microsoft-agent-framework
          - provider: claude-agent-sdk
            python-version: "3.14"
            tox-environment: integration-py314-claude-agent-sdk
          - provider: crewai
            python-version: "3.13"
            tox-environment: integration-py313-crewai
          - provider: google-adk
            python-version: "3.14"
            tox-environment: integration-py314-google-adk
          - provider: haystack
            python-version: "3.14"
            tox-environment: integration-py314-haystack
          - provider: langchain
            python-version: "3.14"
            tox-environment: integration-py314-langchain
          - provider: langgraph
            python-version: "3.13"
            tox-environment: integration-py313-langgraph
          - provider: llamaindex
            python-version: "3.14"
            tox-environment: integration-py314-llamaindex
          - provider: openai-agents
            python-version: "3.14"
            tox-environment: integration-py314-openai-agents
          - provider: pydantic-ai
            python-version: "3.14"
            tox-environment: integration-py314-pydantic-ai
          - provider: semantic-kernel
            python-version: "3.14"
            tox-environment: integration-py314-semantic-kernel
          - provider: smolagents
            python-version: "3.14"
            tox-environment: integration-py314-smolagents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --dev --locked
      - name: Require the live-test API key
        run: test -n "$SERPAPI_API_KEY" || test -n "$SERPAPI_KEY"
      - name: Run one real search through the native SDK tool
        run: >-
          uv run tox -e ${{ matrix.tox-environment }} --
          python -m pytest -q -m live tests/test_live_adapters.py
